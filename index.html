<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a1356">
<title>TV Remote Note</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a3cc9'/%3E%3Cstop offset='1' stop-color='%23c0438f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' fill='url(%23g)'/%3E%3Crect x='38' y='50' width='104' height='72' rx='14' fill='none' stroke='white' stroke-width='9'/%3E%3Cpath d='M70 140h40' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #1b0d3f; --bg-2: #3a1a73; --bg-3: #7a2a86;
    --ink: #ffffff; --ink-2: rgba(255,255,255,.72); --ink-3: rgba(255,255,255,.45);
    --glass: rgba(255,255,255,.10); --line: rgba(255,255,255,.18);
    --pad: rgba(20, 10, 55, .55); --accent: #ffffff; --live: #5dff9a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(170deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%); }
  button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  body { display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(16px, env(safe-area-inset-left, 0px)); }

  .top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dot.on { background: var(--live); box-shadow: 0 0 10px rgba(93,255,154,.9); }
  .tabs { display: flex; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
  .tab { padding: 6px 14px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .tab.on { background: rgba(255,255,255,.9); color: #2a1356; }
  .showbtn { display: flex; align-items: center; gap: 8px; width: 100%; height: 46px; margin-top: 12px; border-radius: 14px;
    justify-content: center; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.12); border: 1px solid var(--line); }
  .showbtn svg { width: 18px; height: 18px; }
  .showbtn.ok { background: rgba(93,255,154,.18); border-color: rgba(93,255,154,.4); }

  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 12px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .pill { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 12px; background: rgba(255,60,90,.2); color: #ffb3c2; border: 1px solid rgba(255,120,150,.35); }
  .pill.ok { background: rgba(93,255,154,.14); color: #b9ffd3; border-color: rgba(93,255,154,.35); }

  /* Note */
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .pad { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 100%; border-radius: 26px; overflow: hidden;
    background: var(--pad); border: 1.5px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 50px rgba(10,0,40,.4); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 15px; pointer-events: none; }

  .colors { display: flex; justify-content: space-between; margin-top: 16px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.25); transition: transform .15s; }
  .sw.on { box-shadow: 0 0 0 3px #fff; transform: scale(1.08); }
  .tools { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .grp { display: flex; gap: 8px; }
  .ic { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--line); }
  .ic.on { background: rgba(255,255,255,.88); color: #2a1356; }
  .ic i { display: block; border-radius: 50%; background: currentColor; }
  .ic svg { width: 20px; height: 20px; }
  .send { margin-top: 14px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-2); font-weight: 500; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .send::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px rgba(93,255,154,.8); }
  button:active { transform: scale(.95); }

  /* Ask */
  .chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 10px; }
  .chat .empty { margin: auto; text-align: center; color: var(--ink-3); font-size: 15px; line-height: 1.5; max-width: 260px; }
  .b { max-width: 85%; padding: 12px 15px; border-radius: 20px; font-size: 16px; line-height: 1.4; white-space: pre-wrap; }
  .b.me { align-self: flex-end; background: rgba(255,255,255,.9); color: #2a1356; border-bottom-right-radius: 6px; }
  .b.tv { align-self: flex-start; background: var(--glass); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .b.wait { color: var(--ink-3); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .chip { flex: none; font-size: 14px; padding: 9px 13px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-2); }
  .composer { display: flex; gap: 8px; }
  .composer input { flex: 1; min-width: 0; height: 52px; border-radius: 26px; padding: 0 18px; background: var(--glass); border: 1px solid var(--line); font-size: 16px; }
  .composer input::placeholder { color: var(--ink-3); }
  .round { width: 52px; height: 52px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--line); }
  .round.go { background: #fff; color: #2a1356; }
  .round.rec { background: #ff3b5c; border-color: transparent; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,59,92,.25); } }
  .round svg { width: 22px; height: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <div class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting to TV…</span></div>
    <div class="tabs"><button class="tab on" data-v="note">Note</button><button class="tab" data-v="ask">Ask Claude</button></div>
  </div>
  <button class="showbtn" id="show"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8" stroke-linecap="round"/></svg><span id="show-t">Show menu on TV</span></button>

  <!-- Note -->
  <section class="view" id="v-note">
    <div class="head"><h1>Leave a note</h1><span class="pill" id="live">Connecting…</span></div>
    <div class="stage"><div class="pad" id="pad"><canvas id="c"></canvas><div class="hint" id="hint">Draw here — it appears on the TV live</div></div></div>
    <div class="colors" id="colors">
      <button class="sw on" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button>
      <button class="sw" data-c="#ffd84d" style="background:#ffd84d" aria-label="Yellow"></button>
      <button class="sw" data-c="#ff9f43" style="background:#ff9f43" aria-label="Orange"></button>
      <button class="sw" data-c="#ff4fa3" style="background:#ff4fa3" aria-label="Pink"></button>
      <button class="sw" data-c="#b47cff" style="background:#b47cff" aria-label="Purple"></button>
      <button class="sw" data-c="#4fb8ff" style="background:#4fb8ff" aria-label="Blue"></button>
      <button class="sw" data-c="#4dff9c" style="background:#4dff9c" aria-label="Green"></button>
      <button class="sw" data-c="#ff4d5e" style="background:#ff4d5e" aria-label="Red"></button>
    </div>
    <div class="tools">
      <div class="grp" id="sizes">
        <button class="ic" data-w="4" aria-label="Fine pen"><i style="width:5px;height:5px"></i></button>
        <button class="ic on" data-w="8" aria-label="Medium pen"><i style="width:9px;height:9px"></i></button>
        <button class="ic" data-w="15" aria-label="Thick pen"><i style="width:14px;height:14px"></i></button>
      </div>
      <div class="grp">
        <button class="ic" id="eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 16l9-9 6 6-7 7H8z"/><path d="M12 20h8" stroke-linecap="round"/></svg></button>
        <button class="ic" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2"/></svg></button>
        <button class="ic" id="clear" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
    </div>
    <div class="send" id="sendstate">Every stroke shows up on the TV as you draw</div>
  </section>

  <!-- Ask -->
  <section class="view" id="v-ask" hidden>
    <div class="head"><h1>Ask Claude</h1><span class="pill ok">Answers on the TV</span></div>
    <div class="chat" id="chat"><div class="empty" id="empty">Ask anything. Claude answers on the TV, and the reply shows up here too.</div></div>
    <div class="chips">
      <button class="chip">What should we watch tonight?</button>
      <button class="chip">Weather tomorrow?</button>
      <button class="chip">Put on some chill music</button>
      <button class="chip">Open Netflix</button>
    </div>
    <div class="composer">
      <input id="q" type="text" placeholder="Ask anything…" autocomplete="off" enterkeyhint="send">
      <button class="round" id="mic" aria-label="Speak" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="round go" id="go" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </section>

<script>
/* mqtt-lite: tiny MQTT 3.1.1 client over WebSocket (QoS 0 only). ES5, no dependencies.
   var c = new MqttLite("wss://broker.hivemq.com:8884/mqtt");
   c.onstatus = function (connected) {};
   c.subscribe("topic/#", function (topic, text) {});
   c.publish("topic/x", "hello", { retain: true });
*/
(function (root) {
  "use strict";
  var enc = new TextEncoder(), dec = new TextDecoder();

  function str(s) { var b = enc.encode(s); return [b.length >> 8, b.length & 255].concat(Array.prototype.slice.call(b)); }
  function packet(type, body) {
    var len = body.length, head = [type];
    do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; head.push(d); } while (len > 0);
    var out = new Uint8Array(head.length + body.length);
    out.set(head, 0); out.set(body, head.length);
    return out;
  }
  function concatBytes(a, b) {
    var arr = new Array(a.length + b.length), i;
    for (i = 0; i < a.length; i++) arr[i] = a[i];
    for (i = 0; i < b.length; i++) arr[a.length + i] = b[i];
    return arr;
  }
  function match(filter, topic) {
    if (filter === topic) return true;
    var f = filter.split("/"), t = topic.split("/");
    for (var i = 0; i < f.length; i++) {
      if (f[i] === "#") return true;
      if (f[i] !== "+" && f[i] !== t[i]) return false;
    }
    return f.length === t.length;
  }

  function MqttLite(url, opts) {
    opts = opts || {};
    this.urls = [].concat(url);
    this.urlIndex = 0;
    this.clientId = opts.clientId || ("ml" + Math.random().toString(36).slice(2, 12));
    this.keepAlive = opts.keepAlive || 30;
    this.subs = [];
    this.queue = [];
    this.connected = false;
    this.packetId = 1;
    this.retry = 500;
    this.onstatus = null;
    this._connect();
  }

  MqttLite.prototype._status = function (c) {
    if (this.connected === c) return;
    this.connected = c;
    if (this.onstatus) try { this.onstatus(c); } catch (e) {}
  };

  MqttLite.prototype._connect = function () {
    var self = this, url = this.urls[this.urlIndex % this.urls.length];
    var ws;
    try { ws = new WebSocket(url, ["mqtt"]); } catch (e) { return this._reconnect(); }
    ws.binaryType = "arraybuffer";
    this.ws = ws;
    this.buf = new Uint8Array(0);
    ws.onopen = function () {
      var body = [0, 4, 77, 81, 84, 84, 4, 2, self.keepAlive >> 8, self.keepAlive & 255].concat(str(self.clientId));
      ws.send(packet(0x10, body));
    };
    ws.onmessage = function (ev) { self._data(new Uint8Array(ev.data)); };
    ws.onclose = ws.onerror = function () {
      if (self.ws !== ws) return;
      self.ws = null;
      clearInterval(self.ping);
      self._status(false);
      self._reconnect();
    };
  };

  MqttLite.prototype._reconnect = function () {
    var self = this;
    clearTimeout(this.rt);
    this.urlIndex++;
    this.rt = setTimeout(function () { self._connect(); }, this.retry);
    this.retry = Math.min(this.retry * 2, 8000);
  };

  MqttLite.prototype._data = function (chunk) {
    var b = new Uint8Array(this.buf.length + chunk.length);
    b.set(this.buf, 0); b.set(chunk, this.buf.length);
    this.buf = b;
    while (this.buf.length >= 2) {
      var mult = 1, len = 0, i = 1, d;
      do {
        if (i >= this.buf.length) return;
        d = this.buf[i++]; len += (d & 127) * mult; mult *= 128;
      } while (d & 128);
      if (this.buf.length < i + len) return;
      var type = this.buf[0], body = this.buf.subarray(i, i + len);
      this.buf = this.buf.subarray(i + len);
      this._packet(type, body);
    }
  };

  MqttLite.prototype._packet = function (type, body) {
    var self = this, kind = type >> 4;
    if (kind === 2) {                       // CONNACK
      if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
      this.retry = 500;
      this._status(true);
      this.ping = setInterval(function () { self._send(new Uint8Array([0xC0, 0])); }, this.keepAlive * 800);
      this.subs.forEach(function (s) { self._sendSub(s.topic); });
      var q = this.queue; this.queue = [];
      q.forEach(function (p) { self._send(p); });
    } else if (kind === 3) {                // PUBLISH
      var tl = (body[0] << 8) | body[1];
      var topic = dec.decode(body.subarray(2, 2 + tl));
      var off = 2 + tl + (((type >> 1) & 3) > 0 ? 2 : 0);
      var text = dec.decode(body.subarray(off));
      var retained = (type & 1) === 1;
      this.subs.forEach(function (s) { if (match(s.topic, topic)) try { s.fn(topic, text, retained); } catch (e) {} });
    }
  };

  MqttLite.prototype._send = function (bytes) {
    if (this.ws && this.connected) { try { this.ws.send(bytes); return true; } catch (e) {} }
    return false;
  };

  MqttLite.prototype._sendSub = function (topic) {
    var id = this.packetId = (this.packetId % 65535) + 1;
    this._send(packet(0x82, [id >> 8, id & 255].concat(str(topic), [0])));
  };

  MqttLite.prototype.subscribe = function (topic, fn) {
    this.subs.push({ topic: topic, fn: fn });
    if (this.connected) this._sendSub(topic);
  };

  MqttLite.prototype.publish = function (topic, text, opts) {
    var p = packet(0x30 | (opts && opts.retain ? 1 : 0), concatBytes(str(topic), enc.encode(text)));
    if (!this._send(p)) {
      if (opts && opts.retain) this.queue = this.queue.filter(function (q) { return !q._retainTopic || q._retainTopic !== topic; });
      if (opts && opts.retain) p._retainTopic = topic;
      this.queue.push(p);
      if (this.queue.length > 400) this.queue.shift();
    }
  };

  root.MqttLite = MqttLite;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
(function () {
  "use strict";
  // Must match phone.channel in the TV's config.js. A different channel can be passed in the link: …/#channel-name
  var RELAY = "https://ntfy.sh";
  // The private channel comes only from your personal link (…/#your-channel), never from this public file.
  var CHANNEL = location.hash.slice(1);
  try { if (CHANNEL) localStorage.setItem("tvChannel", CHANNEL); else CHANNEL = localStorage.getItem("tvChannel") || ""; } catch (e) {}
  if (!/^[A-Za-z0-9_-]{8,64}$/.test(CHANNEL)) {
    document.body.innerHTML = '<div style="margin:auto;max-width:300px;text-align:center;line-height:1.5">' +
      '<h1 style="font-size:24px;margin-bottom:10px">Open your personal link</h1>' +
      '<p style="color:rgba(255,255,255,.7)">This page needs the private link shown on your TV under <b>Connect phone</b>.</p></div>';
    return;
  }
  var URL_PUB = RELAY + "/" + encodeURIComponent(CHANNEL);
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- tabs ---------- */
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var t = e.target.closest(".tab"); if (!t) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === t); });
    $("v-note").hidden = t.dataset.v !== "note"; $("v-ask").hidden = t.dataset.v !== "ask";
    if (t.dataset.v === "note") resize();
  });

  /* ---------- link to TV (sending, in order) ---------- */
  var queue = [], sending = false, sent = 0;
  function enqueue(msg) { queue.push(msg); pump(); }
  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    fetch(URL_PUB, { method: "POST", body: JSON.stringify(queue[0]) })
      .then(function (r) {
        if (r.status === 429) throw new Error("Busy — retrying");
        if (!r.ok) throw new Error("Can't reach TV link");
        queue.shift(); sent++;
      })
      .catch(function (e) {
        return new Promise(function (res) { setTimeout(res, 3000); });
      })
      .then(function () { sending = false; pump(); });
  }

  // Listen for the TV's replies
  var es = new EventSource(URL_PUB + "/sse");
  /* ---------- live drawing link (MQTT) ---------- */
  var T = "voxmenu/" + CHANNEL;
  var mq = new MqttLite(["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"]);
  mq.onstatus = function (ok) {
    $("dot").classList.toggle("on", ok);
    $("conn").textContent = ok ? "Connected" : "Reconnecting…";
    $("live").textContent = ok ? "Live on TV" : "Offline"; $("live").className = ok ? "pill ok" : "pill";
  };
  var mySnapT = 0, snapTimer = null;
  function sendSnapshot() {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(function () {
      mySnapT = Date.now();
      mq.publish(T + "/note", JSON.stringify({ v: 1, t: mySnapT, strokes: strokes.map(function (x) { return { id: x.id, c: x.c, w: x.w, p: x.p }; }) }), { retain: true });
    }, 120);
  }
  mq.subscribe(T + "/note", function (t, text) {
    if (!text || cur) return;
    var snap; try { snap = JSON.parse(text); } catch (e) { return; }
    if (snap.t === mySnapT) return;          // our own echo
    strokes = (snap.strokes || []).map(function (x) { return { id: x.id, c: x.c, w: x.w, p: x.p.slice() }; });
    redraw();
  });
  es.onmessage = function (ev) {
    var o; try { o = JSON.parse(ev.data); } catch (e) { return; }
    if (o.event && o.event !== "message") return;
    var m; try { m = JSON.parse(o.message); } catch (e) { return; }
    if (m.k === "shown" && m.id === showId) { clearTimeout(showTimer); $("show").className = "showbtn ok"; $("show-t").textContent = "Menu is on the TV"; setTimeout(resetShow, 3000); return; }
    if (m.k === "reply" && waiting[m.id]) { waiting[m.id].className = "b tv"; waiting[m.id].textContent = m.text; delete waiting[m.id]; scrollChat(); }
  };

  /* ---------- show menu ---------- */
  var showId = null, showTimer = null;
  function resetShow() { $("show").className = "showbtn"; $("show-t").textContent = "Show menu on TV"; }
  $("show").addEventListener("click", function () {
    showId = "s" + Date.now();
    $("show-t").textContent = "Calling the menu…";
    enqueue({ k: "show", id: showId });
    clearTimeout(showTimer);
    showTimer = setTimeout(function () {
      $("show-t").textContent = "Menu not running — open Home Menu once with the remote";
      setTimeout(resetShow, 6000);
    }, 8000);
  });

  /* ---------- drawing ---------- */
  var canvas = $("c"), pad = $("pad"), ctx = canvas.getContext("2d");
  var color = "#ffffff", width = 8, erasing = false;
  var strokes = []; // local copy for undo/redraw

  function resize() {
    var r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!r.width) return;
    canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);
    redraw();
  }
  window.addEventListener("resize", resize);

  function paint(st, from) {
    var sx = canvas.width / 1000, sy = canvas.height / 1000, p = st.p;
    ctx.save();
    ctx.globalCompositeOperation = st.c === "erase" ? "destination-out" : "source-over";
    ctx.strokeStyle = ctx.fillStyle = st.c === "erase" ? "#000" : st.c;
    ctx.lineWidth = st.w * sx * (st.c === "erase" ? 3 : 1); ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0] * sx, p[1] * sy, ctx.lineWidth / 2, 0, 6.283); ctx.fill(); }
    else { var s = Math.max(0, from - 2); ctx.beginPath(); ctx.moveTo(p[s] * sx, p[s + 1] * sy); for (var i = s + 2; i < p.length; i += 2) ctx.lineTo(p[i] * sx, p[i + 1] * sy); ctx.stroke(); }
    ctx.restore();
  }
  function redraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); strokes.forEach(function (s) { paint(s, 0); }); $("hint").hidden = strokes.length > 0; }

  var cur = null, pending = [], timer = null, last = null;
  function pos(e) { var r = canvas.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; }
  function flush() { if (!cur || !pending.length) return; mq.publish(T + "/ink", JSON.stringify({ k: "s", s: cur.id, c: cur.c, w: cur.w, p: pending })); pending = []; }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    var p = pos(e);
    cur = { id: (Date.now() % 1e9) + Math.floor(Math.random() * 999), c: erasing ? "erase" : color, w: width, p: [p[0], p[1]] };
    strokes.push(cur); last = p; pending = [p[0], p[1]];
    paint(cur, 0); $("hint").hidden = true;
    timer = setInterval(flush, 40);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!cur) return;
    var p = pos(e);
    if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 4) return;
    cur.p.push(p[0], p[1]); pending.push(p[0], p[1]); last = p;
    paint(cur, cur.p.length - 2);
    if (pending.length > 200) flush();
  });
  function end() { if (!cur) return; clearInterval(timer); flush(); cur = null; sendSnapshot(); }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);

  $("colors").addEventListener("click", function (e) {
    var b = e.target.closest(".sw"); if (!b) return;
    color = b.dataset.c; erasing = false; $("eraser").classList.remove("on");
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
  });
  $("sizes").addEventListener("click", function (e) {
    var b = e.target.closest(".ic"); if (!b) return;
    width = +b.dataset.w;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
  });
  $("eraser").addEventListener("click", function () { erasing = !erasing; this.classList.toggle("on", erasing); });
  $("undo").addEventListener("click", function () {
    var st = strokes.pop(); if (!st) return;
    redraw(); mq.publish(T + "/ink", JSON.stringify({ k: "undo", s: st.id })); sendSnapshot();
  });
  $("clear").addEventListener("click", function () { strokes = []; redraw(); mq.publish(T + "/ink", JSON.stringify({ k: "clear" })); sendSnapshot(); });

  /* ---------- ask ---------- */
  var waiting = {};
  function scrollChat() { var c = $("chat"); c.scrollTop = c.scrollHeight; }
  function bubble(cls, text) { $("empty").hidden = true; var b = document.createElement("div"); b.className = "b " + cls; b.textContent = text; $("chat").appendChild(b); scrollChat(); return b; }
  function send(text) {
    text = (text || $("q").value).trim(); if (!text) return;
    $("q").value = "";
    bubble("me", text);
    var id = "q" + Date.now();
    waiting[id] = bubble("tv wait", "Claude is answering on the TV…");
    enqueue({ k: "ask", q: text, id: id });
    setTimeout(function () { if (waiting[id]) { waiting[id].textContent = "No answer from the TV. Is it on, with the menu open?"; delete waiting[id]; } }, 60000);
  }
  $("go").addEventListener("click", function () { send(); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); send(); } });
  [].forEach.call(document.querySelectorAll(".chip"), function (c) { c.addEventListener("click", function () { send(c.textContent); }); });

  // Voice input where the browser supports it
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var mic = $("mic"); mic.hidden = false;
    var rec = null;
    mic.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true;
      mic.classList.add("rec");
      rec.onresult = function (e) {
        var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        $("q").value = t;
        if (e.results[e.results.length - 1].isFinal) send(t);
      };
      rec.onend = rec.onerror = function () { mic.classList.remove("rec"); rec = null; };
      rec.start();
    });
  }

  resize();
})();
</script>
</body>
</html>
